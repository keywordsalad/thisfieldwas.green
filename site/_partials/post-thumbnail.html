{{#if thumbnail-}}
<div class="post-thumbnail">
  <a href="{{thumbnail}}">
    <picture>
      {{#if (thumbnail | asWebp)-}}
      <source srcset="{{thumbnail | asWebp}}" type="image/webp">
      {{-#end}}
      <img src="{{thumbnail}}" alt="{{title}}" width="128" height="128" loading="lazy">
    </picture>
  </a>
</div>
{{-#end}}
